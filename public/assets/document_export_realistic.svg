<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 900' role='img' aria-labelledby='t d'>
  <title id='t'>Document Export workspace scene</title>
  <desc id='d'>Realistic office dashboard visual for Document Export. No people or faces are present.</desc>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#e7ebef'/>
      <stop offset='100%' stop-color='#d8dde3'/>
    </linearGradient>
    <linearGradient id='desk' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0%' stop-color='#b08968'/>
      <stop offset='100%' stop-color='#7f5539'/>
    </linearGradient>
    <filter id='shadow' x='-20%' y='-20%' width='140%' height='160%'>
      <feDropShadow dx='0' dy='8' stdDeviation='14' flood-color='#000' flood-opacity='0.2'/>
    </filter>
  </defs>
  <rect width='1600' height='900' fill='url(#bg)'/>
  <rect x='0' y='590' width='1600' height='310' fill='url(#desk)'/>

  <rect x='260' y='150' width='1080' height='600' rx='26' fill='#101722' filter='url(#shadow)'/>
  <rect x='290' y='180' width='1020' height='540' rx='14' fill='#1f2d3d'/>

  <rect x='340' y='230' width='420' height='220' rx='12' fill='#6d5a79'/>
  <rect x='790' y='230' width='470' height='46' rx='8' fill='#4f6478'/>
  <rect x='790' y='292' width='470' height='46' rx='8' fill='#596f84'/>
  <rect x='790' y='354' width='470' height='46' rx='8' fill='#486179'/>

  <rect x='340' y='488' width='920' height='190' rx='12' fill='#24384f'/>
  <rect x='380' y='526' width='36' height='110' rx='4' fill='#84a98c'/>
  <rect x='430' y='502' width='36' height='134' rx='4' fill='#cad2c5'/>
  <rect x='480' y='472' width='36' height='164' rx='4' fill='#f6bd60'/>
  <rect x='530' y='452' width='36' height='184' rx='4' fill='#e76f51'/>
  <circle cx='705' cy='564' r='62' fill='#6d5a79'/>
  <circle cx='705' cy='564' r='36' fill='#24384f'/>

  <rect x='960' y='520' width='260' height='16' rx='8' fill='#9fb3c8'/>
  <rect x='960' y='548' width='210' height='16' rx='8' fill='#9fb3c8'/>
  <rect x='960' y='576' width='240' height='16' rx='8' fill='#9fb3c8'/>
  <rect x='960' y='604' width='170' height='16' rx='8' fill='#9fb3c8'/>

  <rect x='340' y='115' width='360' height='44' rx='10' fill='#f5f6f8' filter='url(#shadow)'/>
  <text x='360' y='145' font-family='Segoe UI, Arial, sans-serif' font-size='28' font-weight='700' fill='#1f2d3d'>Document Export</text>

  <rect x='725' y='115' width='420' height='44' rx='10' fill='#f5f6f8' filter='url(#shadow)'/>
  <text x='745' y='144' font-family='Segoe UI, Arial, sans-serif' font-size='22' font-weight='600' fill='#4a5565'>PDF and report packaging</text>
</svg>
