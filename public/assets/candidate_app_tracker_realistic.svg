<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 900' role='img' aria-labelledby='t d'>
  <title id='t'>Candidate Job Application Kanban Tracker Board</title>
  <desc id='d'>Realistic office setup showing a space-gray laptop displaying a clean Kanban board for job applications, with column states like Applied, Interview, and Offer.</desc>
  <defs>
    <!-- Background wall gradient -->
    <linearGradient id='bgGrad' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#f1f5f9'/>
      <stop offset='100%' stop-color='#e2e8f0'/>
    </linearGradient>
    <!-- Wooden desk gradient -->
    <linearGradient id='deskGrad' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#85583f'/>
      <stop offset='100%' stop-color='#583928'/>
    </linearGradient>
    <!-- Laptop screen border bezel gradient -->
    <linearGradient id='bezelGrad' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#1e293b'/>
      <stop offset='100%' stop-color='#0f172a'/>
    </linearGradient>
    <!-- Shadow filter for laptop and accessories -->
    <filter id='dropShadow' x='-10%' y='-10%' width='120%' height='130%'>
      <feDropShadow dx='0' dy='16' stdDeviation='18' flood-color='#0f172a' flood-opacity='0.15'/>
    </filter>
    <!-- Soft plant leaf gradient -->
    <linearGradient id='leafGrad' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#4d7c0f' stop-opacity='0.6'/>
      <stop offset='100%' stop-color='#1e3a1e' stop-opacity='0.75'/>
    </linearGradient>
    <!-- Coffee mug color gradient -->
    <linearGradient id='mugGrad' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#ffffff'/>
      <stop offset='100%' stop-color='#e2e8f0'/>
    </linearGradient>
  </defs>

  <!-- Wall Background -->
  <rect width='1600' height='900' fill='url(#bgGrad)'/>

  <!-- Soft blurred office window light shadow (overlay) -->
  <path d='M-100,-100 L600,-100 L300,900 L-100,900 Z' fill='#ffffff' opacity='0.25' filter='blur(40px)'/>

  <!-- Soft Plant in Background -->
  <g filter='blur(15px)' opacity='0.55'>
    <circle cx='80' cy='120' r='140' fill='url(#leafGrad)'/>
    <circle cx='180' cy='80' r='110' fill='url(#leafGrad)'/>
    <circle cx='240' cy='190' r='90' fill='url(#leafGrad)'/>
    <path d='M100,260 Q180,300 240,400 Q140,380 80,320 Z' fill='url(#leafGrad)'/>
  </g>

  <!-- Desk Surface -->
  <rect x='0' y='600' width='1600' height='300' fill='url(#deskGrad)'/>
  <!-- Desk highlight line -->
  <rect x='0' y='600' width='1600' height='5' fill='#a16a4f' opacity='0.5'/>

  <!-- ==========================================
       LAPTOP COMPUTER
       ========================================== -->
  <!-- Laptop shadow -->
  <rect x='280' y='120' width='1040' height='500' rx='28' fill='#000000' opacity='0.25' filter='url(#dropShadow)'/>

  <!-- Laptop Screen Lid (Back/Outer Bezel) -->
  <rect x='270' y='110' width='1060' height='510' rx='24' fill='url(#bezelGrad)' />
  
  <!-- Laptop Screen Active Display Area -->
  <rect x='296' y='136' width='1008' height='458' rx='10' fill='#f8fafc' />
  
  <!-- Web Dashboard Header -->
  <rect x='296' y='136' width='1008' height='54' fill='#ffffff' />
  <!-- Border under header -->
  <rect x='296' y='190' width='1008' height='2' fill='#e2e8f0' />
  <!-- Logo/Brand Mark on Screen -->
  <circle cx='330' cy='163' r='12' fill='#bef33e' stroke='#1a1a1a' stroke-width='2' />
  <rect x='354' y='155' width='130' height='16' rx='4' fill='#0f172a' />
  <rect x='510' y='155' width='70' height='16' rx='8' fill='#f1f5f9' />
  
  <!-- Search/Profile in Header -->
  <rect x='1040' y='151' width='180' height='24' rx='12' fill='#f1f5f9' />
  <circle cx='1254' cy='163' r='14' fill='#bef33e' />

  <!-- DASHBOARD SIDEBAR -->
  <rect x='296' y='192' width='80' height='402' fill='#ffffff' />
  <rect x='375' y='192' width='1' height='402' fill='#e2e8f0' />
  <!-- Sidebar Active Tab Indicator -->
  <rect x='296' y='328' width='4' height='40' fill='#bef33e' />
  <!-- Sidebar Menu Icons -->
  <rect x='322' y='224' width='20' height='20' rx='4' fill='#cbd5e1' />
  <rect x='322' y='280' width='20' height='20' rx='4' fill='#cbd5e1' />
  <rect x='320' y='336' width='24' height='24' rx='6' fill='#bef33e' opacity='0.2'/>
  <rect x='326' y='342' width='12' height='12' rx='3' fill='#0f172a' />
  <rect x='322' y='398' width='20' height='20' rx='4' fill='#cbd5e1' />

  <!-- MAIN KANBAN BOARD AREA -->
  
  <!-- Column 1: Applied (340px - 620px) -->
  <rect x='396' y='212' width='270' height='362' rx='12' fill='#f1f5f9' />
  <text x='416' y='242' font-family='Segoe UI, Arial, sans-serif' font-size='14' font-weight='700' fill='#475569'>Applied (3)</text>
  
  <!-- Kanban Card 1.1 -->
  <rect x='408' y='264' width='246' height='80' rx='8' fill='#ffffff' stroke='#e2e8f0' stroke-width='1'/>
  <text x='424' y='292' font-family='Segoe UI, Arial, sans-serif' font-size='13' font-weight='700' fill='#0f172a'>Microsoft</text>
  <text x='424' y='310' font-family='Segoe UI, Arial, sans-serif' font-size='10' font-weight='500' fill='#64748b'>Software SDE-1</text>
  <rect x='580' y='278' width='58' height='16' rx='8' fill='#e0f2fe'/>
  <text x='590' y='390' font-family='Segoe UI, Arial, sans-serif' font-size='8' font-weight='700' fill='#0369a1'>Pending</text>

  <!-- Kanban Card 1.2 -->
  <rect x='408' y='356' width='246' height='80' rx='8' fill='#ffffff' stroke='#e2e8f0' stroke-width='1'/>
  <text x='424' y='384' font-family='Segoe UI, Arial, sans-serif' font-size='13' font-weight='700' fill='#0f172a'>LinkedIn</text>
  <text x='424' y='402' font-family='Segoe UI, Arial, sans-serif' font-size='10' font-weight='500' fill='#64748b'>Backend Intern</text>
  <rect x='580' y='370' width='58' height='16' rx='8' fill='#e0f2fe'/>

  <!-- Kanban Card 1.3 -->
  <rect x='408' y='448' width='246' height='80' rx='8' fill='#ffffff' stroke='#e2e8f0' stroke-width='1'/>
  <text x='424' y='476' font-family='Segoe UI, Arial, sans-serif' font-size='13' font-weight='700' fill='#0f172a'>Amazon</text>
  <text x='424' y='494' font-family='Segoe UI, Arial, sans-serif' font-size='10' font-weight='500' fill='#64748b'>Front End Engineer</text>
  <rect x='580' y='462' width='58' height='16' rx='8' fill='#e0f2fe'/>

  <!-- Column 2: Interviewing (686px - 956px) -->
  <rect x='686' y='212' width='270' height='362' rx='12' fill='#f1f5f9' stroke='#bef33e' stroke-width='2' />
  <text x='706' y='242' font-family='Segoe UI, Arial, sans-serif' font-size='14' font-weight='700' fill='#0f172a'>Interviewing (2)</text>
  
  <!-- Kanban Card 2.1 -->
  <rect x='698' y='264' width='246' height='80' rx='8' fill='#ffffff' stroke='#bef33e' stroke-width='1'/>
  <text x='714' y='292' font-family='Segoe UI, Arial, sans-serif' font-size='13' font-weight='700' fill='#0f172a'>Google</text>
  <text x='714' y='310' font-family='Segoe UI, Arial, sans-serif' font-size='10' font-weight='500' fill='#64748b'>Systems Engineer</text>
  <rect x='870' y='278' width='58' height='16' rx='8' fill='#fef9c3'/>
  <text x='877' y='290' font-family='Segoe UI, Arial, sans-serif' font-size='8' font-weight='700' fill='#a16207'>Technical</text>

  <!-- Kanban Card 2.2 -->
  <rect x='698' y='356' width='246' height='80' rx='8' fill='#ffffff' stroke='#e2e8f0' stroke-width='1'/>
  <text x='714' y='384' font-family='Segoe UI, Arial, sans-serif' font-size='13' font-weight='700' fill='#0f172a'>Uber</text>
  <text x='714' y='402' font-family='Segoe UI, Arial, sans-serif' font-size='10' font-weight='500' fill='#64748b'>Android Developer</text>
  <rect x='870' y='370' width='58' height='16' rx='8' fill='#fef9c3'/>

  <!-- Column 3: Offers (976px - 1246px) -->
  <rect x='976' y='212' width='270' height='362' rx='12' fill='#f1f5f9' />
  <text x='996' y='242' font-family='Segoe UI, Arial, sans-serif' font-size='14' font-weight='700' fill='#475569'>Offers (1)</text>

  <!-- Kanban Card 3.1 -->
  <rect x='988' y='264' width='246' height='80' rx='8' fill='#ffffff' stroke='#e2e8f0' stroke-width='1'/>
  <text x='1004' y='292' font-family='Segoe UI, Arial, sans-serif' font-size='13' font-weight='700' fill='#0f172a'>Meta</text>
  <text x='1004' y='310' font-family='Segoe UI, Arial, sans-serif' font-size='10' font-weight='500' fill='#15803d'>Full Stack SDE — Won</text>
  <rect x='1160' y='278' width='58' height='16' rx='8' fill='#dcfce7'/>

  <!-- Screen Bezel Bottom -->
  <path d='M270,594 C270,600 278,604 288,604 L1312,604 C1322,604 1330,600 1330,594 L1330,580 L270,580 Z' fill='#0f172a'/>
  
  <!-- Laptop Keyboard Base (Aluminium Space-Gray) -->
  <path d='M180,604 L1420,604 L1450,626 L150,626 Z' fill='#334155'/>
  <path d='M150,626 L1450,626 L1430,638 L170,638 Z' fill='#475569'/>
  
  <!-- Laptop Front Lip Highlight & Trackpad Outline -->
  <path d='M170,638 L1430,638 L1420,642 L180,642 Z' fill='#1e293b'/>
  <rect x='700' y='627' width='200' height='10' rx='2' fill='#242e3d' opacity='0.8'/>

  <!-- ==========================================
       DESK ACCESSORIES
       ========================================== -->

  <!-- Left: Minimalist White Ceramic Coffee Mug -->
  <g filter='url(#dropShadow)'>
    <!-- Handle -->
    <path d='M120,680 C80,680 80,730 120,730' fill='none' stroke='url(#mugGrad)' stroke-width='14' stroke-linecap='round'/>
    <!-- Mug Body -->
    <ellipse cx='140' cy='670' rx='45' ry='12' fill='#8a5c38' /> <!-- Coffee liquid -->
    <ellipse cx='140' cy='670' rx='50' ry='15' fill='none' stroke='url(#mugGrad)' stroke-width='6' /> <!-- Mug Rim -->
    <path d='M90,670 C90,750 190,750 190,670 Z' fill='url(#mugGrad)'/>
    <!-- Transparent Coffee Steam -->
    <path d='M130,640 Q120,610 140,580 T130,530' fill='none' stroke='#ffffff' stroke-width='4' stroke-linecap='round' opacity='0.15' filter='blur(2px)'/>
    <path d='M150,645 Q160,620 145,595 T155,545' fill='none' stroke='#ffffff' stroke-width='3' stroke-linecap='round' opacity='0.12' filter='blur(2px)'/>
  </g>

  <!-- Right: Premium Notebook and Pen -->
  <g filter='url(#dropShadow)'>
    <!-- Notebook Cover -->
    <rect x='1120' y='650' width='320' height='210' rx='14' fill='#27272a' transform='rotate(-8, 1280, 755)'/>
    <!-- Gold Cover Spine -->
    <rect x='1120' y='650' width='16' height='210' fill='#bef33e' transform='rotate(-8, 1280, 755)'/>
    <!-- Pages peeking out -->
    <rect x='1138' y='652' width='298' height='204' rx='10' fill='#fef08a' opacity='0.3' transform='rotate(-8, 1280, 755)'/>
    <rect x='1136' y='654' width='298' height='200' rx='10' fill='#fafaf9' transform='rotate(-8, 1280, 755)'/>
    
    <!-- Pen lying diagonally across the notebook -->
    <rect x='1220' y='710' width='180' height='7' rx='3' fill='#bef33e' transform='rotate(18, 1310, 713)'/>
    <polygon points='1400,713 1412,710 1400,707' fill='#1e293b' transform='rotate(18, 1310, 713)'/>
    <!-- Pen metal clip -->
    <rect x='1250' y='709' width='35' height='2' fill='#f3f4f6' transform='rotate(18, 1310, 713)'/>
  </g>

  <!-- Title overlay text -->
  <rect x='340' y='115' width='360' height='44' rx='10' fill='#f5f6f8' filter='url(#shadow)'/>
  <text x='360' y='145' font-family='Segoe UI, Arial, sans-serif' font-size='28' font-weight='700' fill='#1f2d3d'>Job Tracker</text>

  <rect x='725' y='115' width='420' height='44' rx='10' fill='#f5f6f8' filter='url(#shadow)'/>
  <text x='745' y='144' font-family='Segoe UI, Arial, sans-serif' font-size='22' font-weight='600' fill='#4a5565'>Kanban board pipeline tracking</text>
</svg>
